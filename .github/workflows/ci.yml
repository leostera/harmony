name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { otp: "27", elixir: "1.18" }
          - { otp: "28", elixir: "1.19" }
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - name: Deploy the examples
        run: |
          for v in v1 v2 v3; do mix harmony.deploy examples/greeter/$v; done
          test "$(mix harmony.run Greeter.main Joe)" = "Howdy, Joe!"
          test "$(mix harmony.run Greeter.main Joe --release 1)" = "Hello, Joe!"
          mix harmony.deploy examples/mixed --store /tmp/mixed
          test "$(mix harmony.run Shouter.main joe --store /tmp/mixed)" = "HEY JOE!"
          test "$(mix harmony.run Shouter.total 100 --store /tmp/mixed)" = "1 + ... + 100 = 5050"
          mix harmony.deploy examples/words --store /tmp/words
          test "$(mix harmony.run Words.main 'hello big world' --store /tmp/words)" = "Hello Big World"
